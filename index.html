<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a2b3c">
<title>GO BIRD GO - DIRECTED BY MR. NIRMIT</title>
<style>
*{box-sizing:border-box;touch-action:manipulation;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;color:white;font-family:Arial,sans-serif}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:4}
.panel{background:#0f172acc;border:2px solid #38bdf888;border-radius:16px;padding:8px 16px;font-weight:bold;box-shadow:0 0 20px #38bdf833}
.label{font-size:10px;letter-spacing:2px;color:#38bdf8}
.val{font-size:20px;color:#fff}
#audioToggle{pointer-events:auto;background:#0f172acc;border:2px solid #38bdf888;color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#brand{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:3px;color:#64748b;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel"><div class="label">SCORE</div><div id="score" class="val">0</div></div>
  <button id="audioToggle">🔊</button>
  <div class="panel" style="text-align:right"><div class="label">BEST</div><div id="highScore" class="val">0</div></div>
</div>
<div id="brand">DIRECTED BY MR. NIRMIT</div>

<script>
(() => {
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const audioToggleBtn = document.getElementById("audioToggle");

let W, H, DPR;
let running = true;
let last = 0;
let score = 0;
let highScore = localStorage.getItem("gobird_high") || 0;
let audioMuted = false;
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();
}

function playSound(type) {
  if (!audioCtx || audioMuted) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === "flap") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === "hit") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e){}
}

audioToggleBtn.addEventListener("click", () => {
  audioMuted = !audioMuted;
  audioToggleBtn.textContent = audioMuted ? "🔇" : "🔊";
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const bird = { x: W * 0.26, y: H * 0.45, r: 24, vy: 0, gravity: 1200, jump: -390, rot: 0, wingTimer: 0 };
let pipes = [];
let spawnTimer = 0;

function startGame() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  score = 0;
  spawnTimer = 0;
  pipes = [];
  bird.x = W * 0.26;
  bird.y = H * 0.45;
  bird.vy = 0;
  document.getElementById("score").textContent = score;
  document.getElementById("highScore").textContent = highScore;
}

function flap() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  bird.vy = bird.jump;
  playSound("flap");
}

window.addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") flap(); });
window.addEventListener("touchstart", e => { if(e.target !== audioToggleBtn) flap(); }, {passive:true});
window.addEventListener("mousedown", e => { if(e.target !== audioToggleBtn) flap(); });

function drawGreenBird(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  
  ctx.fillStyle = "#3f8d16";
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#1b3c08";
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(r * 0.28, -r * 0.15, r * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(r * 0.38, -r * 0.15, r * 0.25, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.moveTo(r * 0.45, -r * 0.12);
  ctx.lineTo(r * 1.05, r * 0.08);
  ctx.lineTo(r * 0.35, r * 0.35);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function spawnPipePair() {
  const gap = 160;
  const topH = 60 + Math.random() * (H - gap - 180);
  pipes.push({ x: W + 10, topH: topH, bottomY: topH + gap, w: 68, passed: false });
}

function update(dt) {
  bird.vy += bird.gravity * dt;
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.4, Math.min(Math.PI * 0.45, bird.vy * 0.0018));

  if (bird.y + bird.r >= H - 36 || bird.y - bird.r <= 0) {
    playSound("hit");
    if (score > highScore) { highScore = score; localStorage.setItem("gobird_high", highScore); }
    startGame();
    return;
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnTimer = 1.6; spawnPipePair(); }

  for (let p of pipes) {
    p.x -= 180 * dt;
    if (!p.passed && p.x + p.w < bird.x) {
      p.passed = true;
      score++;
      document.getElementById("score").textContent = score;
    }
    if (bird.x + bird.r - 4 > p.x && bird.x - bird.r + 4 < p.x + p.w) {
      if (bird.y - bird.r + 4 < p.topH || bird.y + bird.r - 4 > p.bottomY) {
        playSound("hit");
        if (score > highScore) { highScore = score; localStorage.setItem("gobird_high", highScore); }
        startGame();
        return;
      }
    }
  }
  pipes = pipes.filter(p => p.x + p.w > -20);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(0, 0, W, H);

  pipes.forEach(p => {
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(p.x, 0, p.w, p.topH);
    ctx.fillRect(p.x, p.bottomY, p.w, H - p.bottomY);
  });

  drawGreenBird(bird.x, bird.y, bird.r, bird.rot);

  ctx.fillStyle = "#022c22";
  ctx.fillRect(0, H - 36, W, 36);
}

function loop(now) {
  if (!running) return;
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

startGame();
last = performance.now();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
